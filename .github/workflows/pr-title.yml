name: PR title

# The PR title becomes the commit on main when squash-merged (D-22).
# pull_request_target is safe here: the job never checks out the pull request's code.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Commit types from CONTRIBUTING.md.
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Summary: starts in lower case, no final period.
          subjectPattern: ^[^A-Z].*[^.]$
          subjectPatternError: |
            The summary "{subject}" must start in lower case and must not end with a period.
