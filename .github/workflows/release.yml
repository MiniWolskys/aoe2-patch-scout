name: Release

# Builds the Windows app on a tag and attaches it to the release (D-16, M5).
# The app zip carries no game content; the baseline pack is a separate asset (P-21, P-22).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check THIRD_PARTY_NOTICES is up to date
        run: uv run python tools/third_party_notices.py --check

      - name: Build
        run: uv run pyinstaller packaging/patch-scout.spec --clean --noconfirm

      - name: Check the build has no game content
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem dist -Recurse -File -Include *.dat, *.dds, *.DDS
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "game file in the build: $($_.FullName)" }
            exit 1
          }

      - name: Zip and checksum
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = "PatchScout-$version-windows-x64.zip"
          Compress-Archive -Path dist/PatchScout/* -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash + "  " + $zip | Out-File "$zip.sha256" -Encoding ascii
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: patch-scout-windows
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.ZIP }}" "${{ env.ZIP }}.sha256" --clobber
