[project]
name = "patch-scout"
version = "0.1.0"
description = "Find out what changed in Age of Empires II: Definitive Edition between two game builds."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "the Patch Scout contributors" }]
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.2.1",
]

[project.urls]
Repository = "https://github.com/MiniWolskys/aoe2-patch-scout"

[project.gui-scripts]
patch-scout = "patch_scout.gui.app:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
# First-party code: the package and the development scripts.
src = ["src", "tools"]
# Code blocks in the docs quote upstream sources verbatim; don't reformat them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "N", "T20", "RUF"]

[tool.mypy]
files = ["src", "tests", "tools"]
mypy_path = "tools"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Development scripts in tools/ are imported by their tests.
pythonpath = ["tools"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-m",
    "not game",
    "--cov=patch_scout",
    "--cov=tools",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = ["game: needs a real AoE2:DE install; set AOE2DE_PATH"]
xfail_strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.7",
]
